<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>SmartHifz | تسجيل الدخول</title> 
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"> 
    
    <!-- إعدادات الـ PWA --> 
    <link rel="manifest" href="../manifest.json"> 
    <meta name="theme-color" content="#1abc9c"> 
    <link rel="apple-touch-icon" href="../icons/icon-192.png"> 
    
    <style> 
        :root { --primary: #1abc9c; --secondary: #2c3e50; --bg-light: #f4f9f8; --text-dark: #333; --text-light: #666; } 
        body { font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; background-color: var(--bg-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-dark); } 
        .login-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; } 
        .logo { font-size: 32px; font-weight: 900; color: var(--primary); margin-bottom: 10px; } 
        .subtitle { color: var(--text-light); font-size: 0.95rem; margin-bottom: 30px; } 
        .form-group { margin-bottom: 20px; text-align: right; } 
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--secondary); } 
        .form-group input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: 0.3s; background: #fdfdfd; direction: ltr; } 
        .form-group input:focus { border-color: var(--primary); outline: none; background: white; } 
        .btn { width: 100%; background-color: var(--primary); color: white; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; transition: 0.3s; margin-top: 10px; font-family: inherit; } 
        .btn:hover { background-color: #16a085; transform: translateY(-2px); } 
        .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; }
        .contact-support { margin-top: 25px; font-size: 0.9rem; color: var(--text-light); } 
        .contact-support a { color: var(--primary); text-decoration: none; font-weight: bold; } 
        
        /* تنسيق رسالة الخطأ */
        .error-message {
            color: #ef4444;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
        }
    </style> 
</head> 
<body> 
    <div class="login-container"> 
        <div class="logo">SmartHifz</div> 
        <div class="subtitle">بوابة أولياء الأمور والطلاب</div> 
        
        <!-- رسالة الخطأ (مخفية افتراضياً) -->
        <div id="errorMessage" class="error-message">
            اسم المستخدم أو كلمة المرور غير صحيحة.
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)"> 
            <div class="form-group"> 
                <label for="username">اسم المستخدم (Username)</label> 
                <input type="text" id="username" required placeholder="مثال: youssef2024"> 
            </div> 
            <div class="form-group"> 
                <label for="password">كلمة المرور (Password)</label> 
                <input type="password" id="password" required placeholder="••••••••"> 
            </div> 
            <button type="submit" class="btn" id="loginBtn">تسجيل الدخول</button> 
        </form> 
        <div class="contact-support"> نسيت بيانات الدخول؟ <br> <a href="https://wa.me/201104871728" target="_blank">تواصل مع الدعم الفني</a> </div> 
    </div> 

    <!-- مكتبات فايربيز -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    
    <!-- ربط ملف الإعدادات الخاص بنا -->
    <script src="../firebase-init.js"></script>

    <script> 
        function handleLogin(event) { 
            event.preventDefault(); 
            
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            const rawUsername = document.getElementById('username').value.trim().toLowerCase(); 
            const password = document.getElementById('password').value; 
            
            // إخفاء الخطأ وتغيير شكل الزر
            errorDiv.style.display = 'none';
            btn.innerHTML = 'جاري الدخول...';
            btn.disabled = true;

            const fakeEmailForFirebase = `${rawUsername}@smarthifz.com`; 

            // الدخول الفعلي بفايربيز
            auth.signInWithEmailAndPassword(fakeEmailForFirebase, password)
                .then((userCredential) => {
                    // نجاح! تحويل للداشبورد
                    window.location.href = "dashboard.html"; 
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                    // إظهار رسالة الخطأ
                    errorDiv.style.display = 'block';
                    // إرجاع الزر لشكله الطبيعي
                    btn.innerHTML = 'تسجيل الدخول';
                    btn.disabled = false;
                });
        } 

        // لو اليوزر مسجل دخول أصلاً، وديه الداشبورد فوراً
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script> 
    
    <script> 
        // تسجيل الـ Service Worker ليعمل التطبيق كـ PWA 
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('../sw.js') 
                .then(registration => { console.log('تم تشغيل PWA بنجاح!', registration.scope); }) 
                .catch(error => { console.log('فشل تشغيل PWA:', error); }); 
            }); 
        } 
    </script> 
</body> 
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHifz | Parent Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1abc9c;
            --secondary: #2c3e50;
            --bg-light: #f0fbf9;
            --text-dark: #333;
            --text-light: #666;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
            background: #fdfdfd;
        }

        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(26,188,156,0.1);
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #16a085;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(26, 188, 156, 0.2);
        }

        .contact-support {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .contact-support a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .contact-support a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">SmartHifz</div>
        <div class="subtitle">Parent Dashboard Login</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="parent@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="contact-support">
            Need help or forgot password? <br>
            <a href="https://wa.me/201104871728" target="_blank">Contact Support on WhatsApp</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            // هذا كود مبدئي للتجربة فقط، لاحقاً سنربطه بـ Firebase
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(email && password) {
                // محاكاة تسجيل الدخول الناجح والتحويل لصفحة الداشبورد
                window.location.href = "dashboard.html";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHifz | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1abc9c;
            --secondary: #2c3e50;
            --bg-light: #f4f9f8;
            --text-dark: #333;
            --text-light: #666;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-light);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--text-dark);
        }

        .login-container {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 400px;
            box-sizing: border-box; text-align: center;
        }

        .logo { font-size: 32px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .subtitle { color: var(--text-light); font-size: 0.95rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--secondary); }
        .form-group input {
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px;
            font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: 0.3s;
            background: #fdfdfd; direction: ltr; /* نخلي الكتابة من الشمال لليمين علشان اليوزرنيم إنجليزي */
        }
        .form-group input:focus { border-color: var(--primary); outline: none; background: white; }

        .btn {
            width: 100%; background-color: var(--primary); color: white; padding: 15px;
            border-radius: 10px; font-weight: bold; font-size: 1.1rem; border: none;
            cursor: pointer; transition: 0.3s; margin-top: 10px; font-family: inherit;
        }
        .btn:hover { background-color: #16a085; transform: translateY(-2px); }
        .contact-support { margin-top: 25px; font-size: 0.9rem; color: var(--text-light); }
        .contact-support a { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">SmartHifz</div>
        <div class="subtitle">بوابة أولياء الأمور والطلاب</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم (Username)</label>
                <input type="text" id="username" required placeholder="مثال: youssef2024">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور (Password)</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn">تسجيل الدخول</button>
        </form>

        <div class="contact-support">
            نسيت بيانات الدخول؟ <br>
            <a href="https://wa.me/201104871728" target="_blank">تواصل مع الدعم الفني</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const rawUsername = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            // الخدعة: تحويل اليوزرنيم لإيميل وهمي للتعامل مع فايربيز لاحقاً
            const fakeEmailForFirebase = `${rawUsername}@smarthifz.com`;
            
            if(rawUsername && password) {
                console.log("سيتم إرسال هذا لفايربيز: ", fakeEmailForFirebase);
                // محاكاة الدخول
                window.location.href = "dashboard.html";
            }
        }
    </script>
</body>
</html>
